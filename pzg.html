<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偏振光 · 双模式绘图（直角坐标 + 极坐标马吕斯拟合）</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js">
    </script>
    <style>
        :root {
            --bg: #f5f7fa;
            --card: #fff;
            --primary: #4b6cb7;
            --success: #27ae60;
            --danger: #ff6b6b;
            --text: #2c3e50;
            --border: #e9ecef;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
            --radius: 14px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: #333;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            padding: 16px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #4b6cb7 0%, #1a2a4a 100%);
            color: #fff;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        .header a {
            color: #fff;
            text-decoration: underline;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .control-panel {
            flex: 1 1 460px;
            min-width: 400px;
            max-width: 580px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            max-height: 85vh;
            overflow-y: auto;
        }
        .results-panel {
            flex: 2 1 700px;
            min-width: 480px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            max-height: 85vh;
            overflow-y: auto;
        }
        .panel-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 15px;
            border-bottom: 2.5px solid var(--primary);
            padding-bottom: 8px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-add { background: #28a745; color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn-sm { padding: 4px 10px; font-size: 0.75rem; border-radius: 4px; }
        .group-card {
            background: #fff;
            border: 1.5px solid #dde;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 14px;
            border-left: 5px solid var(--primary);
        }
        .group-card h4 { color: var(--primary); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .group-card h4 input { flex: 1 1 100px; min-width: 80px; padding: 6px 10px; font-size: 0.9rem; border: 1px solid #dde; border-radius: 6px; }
        .var-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
        .var-tag { background: #e8f4fc; border-radius: 6px; padding: 4px 10px; display: flex; align-items: center; gap: 4px; font-size: 0.85rem; }
        .var-tag input { width: 70px; padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.8rem; background: #fff; }
        .var-tag .remove-var-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 2px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 6px; }
        .data-table th { background: #f1f5f9; padding: 6px 4px; text-align: center; font-weight: 600; color: #555; font-size: 0.78rem; border: 1px solid #e2e8f0; }
        .data-table td { padding: 4px 2px; text-align: center; border: 1px solid #e2e8f0; }
        .data-table input { width: 65px; padding: 5px 4px; font-size: 0.8rem; text-align: center; border: 1px solid #e2e8f0; border-radius: 4px; background: #fafbfc; }
        .remove-row-btn { background: #ff6b6b22; color: var(--danger); border: 1px solid #ff6b6b55; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 14px; font-weight: 700; }
        .axis-select { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; font-size: 0.85rem; }
        .axis-select select { padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 0.85rem; }
        .y-checkboxes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .y-checkboxes label { display: flex; align-items: center; gap: 3px; font-size: 0.82rem; cursor: pointer; }
        .mode-tabs { display: flex; gap: 10px; margin: 12px 0; }
        .mode-tab { padding: 8px 20px; border-radius: 20px; background: #e9ecef; cursor: pointer; font-weight: 600; font-size: 0.9rem; border: 2px solid transparent; transition: 0.2s; }
        .mode-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .chart-box { margin-top: 10px; background: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px; }
        .chart-box h4 { color: var(--primary); margin-bottom: 10px; font-size: 1.05rem; }
        .chart-container { width: 100%; height: 380px; position: relative; }
        .chart-container canvas { width: 100% !important; height: 100% !important; }
        .polar-canvas-box { text-align: center; }
        .polar-canvas-box canvas { max-width: 100%; height: auto; }
        .download-btn { margin-top: 10px; padding: 8px 18px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: background 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .download-btn:hover { background: #3a5a9f; }
        .empty-state { color: #999; text-align: center; padding-top: 40px; font-size: 0.95rem; }
        .info-box { background: #e8f4fc; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.85rem; color: #2c3e50; }
        .fit-options { display: flex; gap: 12px; align-items: center; font-size: 0.85rem; }
        .fit-warning { margin-top: 10px; padding: 10px; background: #fff4df; color: #8a5a00; border-radius: 6px; text-align: left; overflow-wrap: anywhere; }
        .plot-note { margin-top: 8px; color: #667; font-size: 0.8rem; }
        .chart-box h4 { overflow-wrap: anywhere; }
        @media (max-width: 640px) {
            body { padding: 10px; }
            .container { gap: 14px; }
            .control-panel, .results-panel { flex: 1 1 100%; width: 100%; min-width: 0; max-width: none; max-height: none; overflow-y: visible; padding: 14px; }
            .group-card { padding: 12px; }
            .group-card h4 { flex-wrap: wrap; }
            .group-card h4 input { min-width: 0; }
            .mode-tabs { flex-wrap: wrap; gap: 8px; }
            .mode-tab { flex: 1 1 130px; padding: 8px 12px; text-align: center; }
            .fit-options { flex-wrap: wrap; }
            .axis-select select { min-width: 0; max-width: 100%; }
            .y-checkboxes { min-width: 0; }
            .y-checkboxes label { overflow-wrap: anywhere; }
            .chart-box { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>🔆 偏振光实验 · 双模式绘图（直角坐标 + 极坐标马吕斯拟合）</h2>
        <a href="index.html">← 返回主页</a>
    </div>
    <div class="container">
        <div class="control-panel">
            <h3 class="panel-title">📋 数据组管理</h3>
            <div class="info-box">
                💡 自定义变量名，两种图表模式。<br>
                🔹 新行：角度自动+10°，其它值复制上一行。<br>
                🔹 极坐标使用 <strong>马吕斯定律拟合 I = I₀·cos²(θ - θ₀)</strong>。
            </div>
            <div class="mode-tabs">
                <div class="mode-tab active" data-mode="cartesian">📈 直角坐标图</div>
                <div class="mode-tab" data-mode="polar">🎯 极坐标图</div>
            </div>

            <div id="mode-cartesian-settings" style="margin-bottom:10px;">
                <div class="axis-select">
                    <span>📐 X轴变量：</span>
                    <select id="global-x-var-select"></select>
                    <span style="margin-left:8px;">📈 Y轴变量：</span>
                    <div id="global-y-checkboxes" class="y-checkboxes"></div>
                </div>
            </div>

            <div id="mode-polar-settings" style="display:none;margin-bottom:10px;">
                <div class="axis-select">
                    <span>🎯 极角（角度）变量：</span>
                    <select id="polar-angle-var-select"></select>
                </div>
                <div class="fit-options" style="margin-top:6px;">
                    <label><input type="checkbox" id="polar-use-fit" checked> 马吕斯拟合 I = I₀·cos²(θ-θ₀)</label>
                    <label><input type="checkbox" id="polar-show-points" checked> 显示原始数据点</label>
                </div>
                <div class="fit-options">
                    <label>归一化 <input type="checkbox" id="polar-normalize" checked></label>
                    <label>半径缩放 <input type="number" id="polar-radius-scale" value="1.0" step="0.05" min="0.5" max="2.0" style="width:65px;"></label>
                </div>
            </div>

            <div id="groups-container"></div>
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-add" onclick="addGroup()">➕ 添加数据组</button>
                <button class="btn btn-primary" id="plot-cartesian-btn">🚀 绘制直角坐标图</button>
                <button class="btn btn-primary" id="plot-polar-btn" style="display:none;">🎯 绘制极坐标图</button>
            </div>
        </div>

        <div class="results-panel">
            <h3 class="panel-title">📊 绘图结果</h3>
            <div id="charts-area">
                <p class="empty-state">👆 请填写数据并选择模式绘制</p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const $ = s => document.querySelector(s);
            const groupsContainer = $('#groups-container');
            const chartsArea = $('#charts-area');
            let groupIdCounter = 0;
            let activeCharts = [];

            function createGroup(name = '') {
                groupIdCounter++;
                return {
                    id: 'g' + Date.now() + '_' + groupIdCounter,
                    name: name || `组 ${groupIdCounter}`,
                    variables: [
                        { name: 'I₁', data: [] },
                        { name: 'α', data: [] }
                    ],
                };
            }

            function renderAllGroups(groups) {
                groupsContainer.innerHTML = '';
                groups.forEach(g => renderGroup(g));
                updateGlobalSelectors();
            }

            function renderGroup(g) {
                const card = document.createElement('div');
                card.className = 'group-card';
                card.dataset.groupId = g.id;
                card.innerHTML = buildGroupHTML(g);
                groupsContainer.appendChild(card);
                bindGroupEvents(card, g);
            }

            function buildGroupHTML(g) {
                let html = `<h4><span>🏷️</span>
                    <input type="text" class="group-name-input" value="${escapeHtml(g.name)}" placeholder="组名称">
                    <button class="btn btn-danger btn-sm remove-group-btn">🗑️ 删除组</button></h4>
                <div class="var-list"><span style="font-weight:600;">变量：</span>`;
                g.variables.forEach((v, vi) => {
                    html += `<span class="var-tag">
                        <input type="text" class="var-name-input" value="${escapeHtml(v.name)}" data-vi="${vi}">
                        ${g.variables.length > 1 ? `<button class="remove-var-btn" data-vi="${vi}">×</button>` : ''}
                    </span>`;
                });
                html += `<button class="btn btn-outline btn-sm add-var-btn">+ 添加变量</button></div>
                <div style="overflow-x:auto;"><table class="data-table"><thead><tr>`;
                g.variables.forEach(v => html += `<th>${escapeHtml(v.name)}</th>`);
                html += `<th></th></tr></thead><tbody class="data-tbody">`;
                const rowCount = g.variables[0]?.data.length || 0;
                for (let ri = 0; ri < rowCount; ri++) {
                    html += `<tr class="data-row" data-ri="${ri}">`;
                    g.variables.forEach((v, vi) => {
                        const val = v.data[ri] !== undefined ? v.data[ri] : '';
                        html += `<td><input type="number" class="cell-input" data-vi="${vi}" value="${val}" step="any"></td>`;
                    });
                    html += `<td><button class="remove-row-btn">×</button></td></tr>`;
                }
                html += `</tbody></table></div>
                <button class="btn btn-outline btn-sm add-row-btn" style="margin-top:6px;">+ 添加数据行</button>`;
                return html;
            }

            function bindGroupEvents(card, g) {
                card.querySelector('.group-name-input').oninput = function() { g.name = this.value.trim() || g.name; };
                card.querySelector('.remove-group-btn').onclick = () => {
                    if (confirm(`删除组"${g.name}"吗？`)) { card.remove(); updateGlobalSelectors(); }
                };
                card.querySelectorAll('.var-name-input').forEach(inp => {
                    inp.oninput = function() {
                        const vi = +this.dataset.vi;
                        if (g.variables[vi]) {
                            const oldName = g.variables[vi].name;
                            const newName = this.value.trim() || oldName;
                            g.variables[vi].name = newName;
                            const header = card.querySelectorAll('.data-table thead th')[vi];
                            if (header) header.textContent = newName;
                            updateGlobalSelectors(oldName, newName);
                        }
                    };
                });
                card.querySelectorAll('.remove-var-btn').forEach(btn => {
                    btn.onclick = () => {
                        const vi = +btn.dataset.vi;
                        if (g.variables.length <= 1) return alert('至少保留一个变量');
                        if (confirm(`删除变量"${g.variables[vi].name}"吗？`)) {
                            g.variables.splice(vi, 1);
                            refreshGroupCard(card, g);
                            updateGlobalSelectors();
                        }
                    };
                });
                card.querySelector('.add-var-btn').onclick = () => {
                    const newName = `V_${g.variables.length + 1}`;
                    const len = g.variables[0]?.data.length || 0;
                    g.variables.push({ name: newName, data: new Array(len).fill(NaN) });
                    refreshGroupCard(card, g);
                    updateGlobalSelectors();
                };
                card.querySelector('.add-row-btn').onclick = () => {
                    const selectedAngle = $('#polar-angle-var-select').value;
                    const angleName = g.variables.some(v => v.name === selectedAngle) ? selectedAngle : g.variables.find(v => isAngleVar(v.name))?.name;
                    const rowCount = g.variables[0]?.data.length || 0;
                    if (rowCount === 0) {
                        g.variables.forEach(v => v.data.push(v.name === angleName ? 0 : 0.0));
                    } else {
                        const lastIdx = rowCount - 1;
                        g.variables.forEach(v => {
                            if (v.name === angleName) {
                                const last = v.data[lastIdx];
                                v.data.push((Number.isFinite(last) ? last : 0) + 10);
                            } else {
                                const last = v.data[lastIdx];
                                v.data.push(isNaN(last) ? 0.0 : last);
                            }
                        });
                    }
                    refreshGroupCard(card, g);
                };
                card.querySelector('.data-tbody').addEventListener('click', e => {
                    const btn = e.target.closest('.remove-row-btn');
                    if (!btn) return;
                    const ri = +btn.closest('.data-row').dataset.ri;
                    if (!isNaN(ri) && ri >= 0 && g.variables[0].data.length > 0) {
                        g.variables.forEach(v => v.data.splice(ri, 1));
                        refreshGroupCard(card, g);
                    }
                });
                card.querySelector('.data-tbody').addEventListener('input', e => {
                    const inp = e.target;
                    if (!inp.classList.contains('cell-input')) return;
                    const ri = +inp.closest('.data-row').dataset.ri;
                    const vi = +inp.dataset.vi;
                    if (!isNaN(ri) && !isNaN(vi) && g.variables[vi] && ri < g.variables[vi].data.length) {
                        g.variables[vi].data[ri] = parseFloat(inp.value);
                    }
                });
            }

            function refreshGroupCard(card, g) {
                const newCard = document.createElement('div');
                newCard.className = 'group-card';
                newCard.dataset.groupId = g.id;
                newCard.innerHTML = buildGroupHTML(g);
                card.replaceWith(newCard);
                bindGroupEvents(newCard, g);
            }

            function isAngleVar(name) { return /α|θ|alpha|theta|angle|角度/i.test(name); }
            function escapeHtml(str) { return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

            function collectAllGroups() {
                return [...document.querySelectorAll('.group-card')].map(card => {
                    const name = card.querySelector('.group-name-input')?.value.trim() || '未命名';
                    const variables = [...card.querySelectorAll('.var-name-input')].map((inp, vi) => ({
                        name: inp.value.trim() || `V_${vi+1}`,
                        data: [...card.querySelectorAll(`.cell-input[data-vi="${vi}"]`)].map(inp => parseFloat(inp.value))
                    }));
                    return { id: card.dataset.groupId, name, variables };
                });
            }

            function collectAllVarNames() {
                const names = new Set();
                collectAllGroups().forEach(g => g.variables.forEach(v => names.add(v.name)));
                return [...names];
            }

            function updateGlobalSelectors(renamedFrom, renamedTo) {
                const names = collectAllVarNames();
                const xSel = $('#global-x-var-select'), yCont = $('#global-y-checkboxes'), aSel = $('#polar-angle-var-select');
                let curX = xSel.value, curA = aSel.value;
                let curY = [...yCont.querySelectorAll('input:checked')].map(cb => cb.value);
                if (renamedFrom && renamedTo && !names.includes(renamedFrom) && names.includes(renamedTo)) {
                    if (curX === renamedFrom) curX = renamedTo;
                    if (curA === renamedFrom) curA = renamedTo;
                    curY = curY.map(name => name === renamedFrom ? renamedTo : name);
                }
                const defaultAngle = names.find(isAngleVar) || names[0] || '';
                const nextX = names.includes(curX) ? curX : defaultAngle;
                const nextA = names.includes(curA) ? curA : defaultAngle;
                xSel.innerHTML = ''; aSel.innerHTML = ''; yCont.innerHTML = '';
                names.forEach(name => {
                    xSel.add(new Option(name, name, false, name === nextX));
                    aSel.add(new Option(name, name, false, name === nextA));
                    const label = document.createElement('label'), checkbox = document.createElement('input'), caption = document.createElement('span');
                    checkbox.type = 'checkbox'; checkbox.className = 'global-y-checkbox'; checkbox.value = name; checkbox.checked = curY.includes(name);
                    caption.textContent = name; label.appendChild(checkbox); label.appendChild(caption); yCont.appendChild(label);
                });
                xSel.value = nextX; aSel.value = nextA;
            }

            // 模式切换
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.onclick = () => {
                    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const isCart = tab.dataset.mode === 'cartesian';
                    $('#mode-cartesian-settings').style.display = isCart ? 'block' : 'none';
                    $('#mode-polar-settings').style.display = isCart ? 'none' : 'block';
                    $('#plot-cartesian-btn').style.display = isCart ? '' : 'none';
                    $('#plot-polar-btn').style.display = isCart ? 'none' : '';
                };
            });

            // ---------- 直角坐标图 ----------
            function drawCartesian() {
                destroyAllCharts();
                const groups = collectAllGroups();
                const xName = $('#global-x-var-select').value;
                const yNames = [...document.querySelectorAll('#global-y-checkboxes input:checked')].map(cb => cb.value);
                if (!xName || yNames.length === 0) return chartsArea.innerHTML = '<p class="empty-state">⚠️ 请选择X/Y轴变量</p>';
                let hasAny = false;
                groups.forEach(g => {
                    const xVar = g.variables.find(v => v.name === xName);
                    if (!xVar) return;
                    const datasets = yNames.map((yName, si) => {
                        const yVar = g.variables.find(v => v.name === yName);
                        if (!yVar) return null;
                        const pts = [];
                        const len = Math.min(xVar.data.length, yVar.data.length);
                        for (let i = 0; i < len; i++) {
                            if (!isNaN(xVar.data[i]) && !isNaN(yVar.data[i])) pts.push({ x: xVar.data[i], y: yVar.data[i] });
                        }
                        if (pts.length === 0) return null;
                        pts.sort((a, b) => a.x - b.x);
                        const colors = ['#4b6cb7','#e74c3c','#27ae60','#f39c12','#8e44ad','#2c3e50'];
                        return {
                            label: `${g.name}: ${yName}`,
                            data: pts,
                            borderColor: colors[si % colors.length],
                            backgroundColor: colors[si % colors.length] + '33',
                            pointRadius: 5,
                            showLine: true,
                            borderWidth: 2.5,
                            tension: 0,
                        };
                    }).filter(Boolean);
                    if (datasets.length) {
                        createCartesianBox(`${g.name} — ${xName} vs ${yNames.join(', ')}`, datasets, xName);
                        hasAny = true;
                    }
                });
                if (!hasAny) chartsArea.innerHTML += '<p class="empty-state">⚠️ 无有效数据</p>';
            }

            function createCartesianBox(title, datasets, xLabel) {
                const box = document.createElement('div');
                box.className = 'chart-box';
                box.innerHTML = `<h4>📈 ${escapeHtml(title)}</h4><div class="chart-container"><canvas></canvas></div>`;
                const canvas = box.querySelector('canvas');
                const btn = document.createElement('button');
                btn.className = 'download-btn';
                btn.textContent = '⬇️ 下载图像 (白色背景PNG)';
                btn.onclick = () => downloadCanvas(canvas, '直角坐标');
                box.appendChild(btn);
                chartsArea.appendChild(box);
                const chart = new Chart(canvas, {
                    type: 'scatter',
                    data: { datasets },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { labels: { usePointStyle: true, padding: 16, font: { size: 12 } } } },
                        scales: { x: { title: { display: true, text: xLabel } }, y: { title: { display: true, text: 'Y 值' } } }
                    }
                });
                activeCharts.push(chart);
            }

            function destroyAllCharts() { activeCharts.forEach(c => c.destroy()); activeCharts = []; chartsArea.innerHTML = ''; }
            function downloadCanvas(canvas, prefix) {
                const tmp = document.createElement('canvas');
                tmp.width = canvas.width; tmp.height = canvas.height;
                const ctx = tmp.getContext('2d');
                ctx.fillStyle = '#fff'; ctx.fillRect(0,0,tmp.width,tmp.height);
                ctx.drawImage(canvas,0,0);
                const a = document.createElement('a');
                a.download = `${prefix}_${Date.now()}.png`;
                a.href = tmp.toDataURL();
                a.click();
            }

            // ---------- 极坐标图（马吕斯拟合 I = I₀·cos²(θ-θ₀)）----------
            function malusFit(anglesDeg, intensities) {
                if (anglesDeg.length < 3 || anglesDeg.length !== intensities.length ||
                    !anglesDeg.every(Number.isFinite) || !intensities.every(v => Number.isFinite(v) && v >= 0)) return null;
                const intensityScale = Math.max(...intensities);
                if (!(intensityScale > 0)) return null;
                const angles = anglesDeg.map(a => (a % 180) * Math.PI / 180);
                const ys = intensities.map(y => y / intensityScale);

                // 三个独立角度方向才能确定当前模型的幅值与偏振方向。
                const cs = angles.map(a => Math.cos(2 * a)), ss = angles.map(a => Math.sin(2 * a));
                const mc = cs.reduce((s, v) => s + v, 0) / cs.length;
                const ms = ss.reduce((s, v) => s + v, 0) / ss.length;
                let cc = 0, sc = 0, cross = 0;
                cs.forEach((v, i) => { cc += (v - mc) ** 2; sc += (ss[i] - ms) ** 2; cross += (v - mc) * (ss[i] - ms); });
                if (!(cc + sc > 0) || cc * sc - cross * cross <= 1e-10 * (cc + sc) ** 2) return null;

                function polynomial(p, t) { return p.reduceRight((v, c) => v * t + c, 0); }
                function rootsBetweenMinusOneAndOne(coefficients) {
                    const magnitude = Math.max(...coefficients.map(Math.abs));
                    if (!(magnitude > 0)) return [];
                    const p = coefficients.map(v => v / magnitude);
                    while (p.length > 1 && Math.abs(p[p.length - 1]) < 1e-13) p.pop();
                    if (p.length === 1) return [];
                    if (p.length === 2) {
                        const root = -p[0] / p[1];
                        return root >= -1 && root <= 1 ? [root] : [];
                    }
                    const critical = rootsBetweenMinusOneAndOne(p.slice(1).map((v, i) => v * (i + 1)));
                    const bounds = [-1, ...critical.filter(t => t > -1 && t < 1), 1].sort((a, b) => a - b);
                    const roots = bounds.filter(t => Math.abs(polynomial(p, t)) < 1e-12);
                    for (let i = 0; i < bounds.length - 1; i++) {
                        let lo = bounds[i], hi = bounds[i + 1], flo = polynomial(p, lo);
                        if (flo * polynomial(p, hi) >= 0) continue;
                        for (let k = 0; k < 60; k++) {
                            const mid = (lo + hi) / 2, fm = polynomial(p, mid);
                            if (flo * fm <= 0) hi = mid;
                            else { lo = mid; flo = fm; }
                        }
                        roots.push((lo + hi) / 2);
                    }
                    return roots.sort((a, b) => a - b).filter((t, i, a) => i === 0 || Math.abs(t - a[i - 1]) > 1e-10);
                }

                let best = null;
                function consider(theta) {
                    const c = angles.map(a => Math.cos(a - theta) ** 2);
                    const den = c.reduce((s, v) => s + v * v, 0);
                    if (!(den > 0)) return;
                    const amplitude = Math.max(0, ys.reduce((s, y, i) => s + y * c[i], 0) / den);
                    const error = ys.reduce((s, y, i) => s + (y - amplitude * c[i]) ** 2, 0);
                    if (!best || error < best.error) best = { amplitude, theta, error };
                }

                // 固定方向时，I₀=Σ(I·cos²)/Σcos⁴。令 t=tan(θ₀)，剩余极值由四次多项式给出。
                // 两个旋转坐标区间覆盖 180° 周期，且都只在 [-1,1] 内求根，避免正切奇点。
                for (const base of [0, Math.PI / 2]) {
                    const N = [0, 0, 0], D = [0, 0, 0, 0, 0];
                    angles.forEach((a, i) => {
                        const u = Math.cos(a - base), v = Math.sin(a - base), y = ys[i];
                        N[0] += y * u * u; N[1] += 2 * y * u * v; N[2] += y * v * v;
                        D[0] += u ** 4; D[1] += 4 * u ** 3 * v; D[2] += 6 * u * u * v * v;
                        D[3] += 4 * u * v ** 3; D[4] += v ** 4;
                    });
                    const dN = [N[1], 2 * N[2]], dD = D.slice(1).map((v, i) => v * (i + 1));
                    const stationary = new Array(6).fill(0);
                    dN.forEach((v, i) => D.forEach((w, j) => { stationary[i + j] += 2 * v * w; }));
                    N.forEach((v, i) => dD.forEach((w, j) => { stationary[i + j] -= v * w; }));
                    [-1, 0, ...rootsBetweenMinusOneAndOne(stationary), 1].forEach(t => consider(base + Math.atan(t)));
                }
                if (!best || !Number.isFinite(best.amplitude * intensityScale)) return null;
                const I0 = best.amplitude * intensityScale;
                const theta0Deg = ((best.theta * 180 / Math.PI + 90) % 180 + 180) % 180 - 90;
                const theta0 = theta0Deg * Math.PI / 180;
                const fitPoints = [];
                for (let a = 0; a <= 360; a += 2) fitPoints.push({ angle: a, intensity: I0 * Math.cos(a * Math.PI / 180 - theta0) ** 2 });
                return { I0, theta0Deg, fitPoints, sse: best.error * intensityScale * intensityScale };
            }

            function drawPolar() {
                destroyAllCharts();
                const groups = collectAllGroups();
                const angleVarName = $('#polar-angle-var-select').value;
                const useFit = $('#polar-use-fit').checked;
                const showPoints = $('#polar-show-points').checked;
                const normalize = $('#polar-normalize').checked;
                const radiusScale = Math.min(2, Math.max(0.5, +$('#polar-radius-scale').value || 1));
                if (!angleVarName) return chartsArea.innerHTML = '<p class="empty-state">⚠️ 请选择极角变量</p>';

                const seriesList = [], warnings = [];
                let globalMaxI = 0;
                groups.forEach(g => {
                    const angVar = g.variables.find(v => v.name === angleVarName);
                    if (!angVar) return;
                    g.variables.forEach(v => {
                        if (v.name === angleVarName) return;
                        const points = [];
                        for (let i = 0; i < Math.min(angVar.data.length, v.data.length); i++) {
                            if (Number.isFinite(angVar.data[i]) && Number.isFinite(v.data[i]) && v.data[i] >= 0) {
                                points.push({ angle: angVar.data[i], intensity: v.data[i] });
                                globalMaxI = Math.max(globalMaxI, v.data[i]);
                            }
                        }
                        if (!points.length) return;
                        points.sort((a, b) => a.angle - b.angle);
                        const fit = useFit ? malusFit(points.map(p => p.angle), points.map(p => p.intensity)) : null;
                        if (fit) globalMaxI = Math.max(globalMaxI, fit.I0);
                        else if (useFit) warnings.push(`${g.name} / ${v.name}：无法完成马吕斯拟合，已显示原始曲线。请至少提供 3 个独立角度方向及非零光强，避免仅使用 0°、90°、180° 等重复方向。`);
                        seriesList.push({ groupName: g.name, varName: v.name, points, fit });
                    });
                });
                if (!seriesList.length) return chartsArea.innerHTML = '<p class="empty-state">⚠️ 所选变量无有效数据</p>';
                if (!(globalMaxI > 0)) globalMaxI = 1;

                const box = document.createElement('div');
                box.className = 'chart-box polar-canvas-box';
                box.innerHTML = `<h4>🎯 极坐标图 (角度: ${escapeHtml(angleVarName)})</h4>`;
                const canvas = document.createElement('canvas');
                canvas.width = 650; canvas.height = 650;
                box.appendChild(canvas);
                const btn = document.createElement('button');
                btn.className = 'download-btn';
                btn.textContent = '⬇️ 下载图像 (白色背景PNG)';
                btn.onclick = () => downloadCanvas(canvas, '极坐标');
                box.appendChild(btn);
                warnings.forEach(text => {
                    const warning = document.createElement('p');
                    warning.className = 'fit-warning'; warning.textContent = '⚠️ ' + text; box.appendChild(warning);
                });
                if (normalize) {
                    const note = document.createElement('p'); note.className = 'plot-note';
                    note.textContent = '归一化以本图数据和拟合曲线的最大光强为 1。'; box.appendChild(note);
                }
                chartsArea.appendChild(box);
                const ctx = canvas.getContext('2d');
                const W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2;
                const maxR = Math.min(cx, cy) * 0.85 * radiusScale;
                // 两种模式共用像素映射；归一化选项只改变刻度所显示的单位。
                const radiusPerIntensity = maxR / globalMaxI;
                ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
                for (let i = 1; i <= 5; i++) {
                    const r = maxR * i / 5;
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                    ctx.strokeStyle = i === 5 ? '#888' : '#dde'; ctx.lineWidth = i === 5 ? 1.5 : 0.6;
                    ctx.setLineDash(i === 5 ? [] : [3, 4]); ctx.stroke(); ctx.setLineDash([]);
                    const value = globalMaxI * i / 5;
                    const label = normalize ? (i / 5).toFixed(1) : (value < 0.01 || value >= 1e5 ? value.toExponential(2) : value.toFixed(2));
                    ctx.fillStyle = '#555'; ctx.font = '10px sans-serif'; ctx.fillText(label, cx + r + 3, cy - 2);
                }
                for (let a = 0; a < 360; a += 15) {
                    const rad = a * Math.PI / 180;
                    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + maxR * Math.cos(rad), cy - maxR * Math.sin(rad));
                    ctx.strokeStyle = a % 90 === 0 ? '#999' : '#e8e8e8'; ctx.lineWidth = a % 90 === 0 ? 0.8 : 0.3; ctx.stroke();
                    if (a % 30 === 0) {
                        const lr = maxR + 18;
                        ctx.fillStyle = '#444'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(a + '°', cx + lr * Math.cos(rad), cy - lr * Math.sin(rad));
                    }
                }
                const colors = ['#4b6cb7', '#e74c3c', '#27ae60', '#f39c12', '#8e44ad', '#2c3e50', '#16a085', '#d35400'];
                const legend = [];
                seriesList.forEach((ser, idx) => {
                    const col = colors[idx % colors.length];
                    const points = ser.fit ? ser.fit.fitPoints : ser.points;
                    if (points.length > 1) {
                        ctx.beginPath();
                        points.forEach((p, i) => {
                            const r = p.intensity * radiusPerIntensity, rad = p.angle * Math.PI / 180;
                            const x = cx + r * Math.cos(rad), y = cy - r * Math.sin(rad);
                            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                        });
                        ctx.closePath(); ctx.fillStyle = col + '22'; ctx.fill();
                        ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
                    }
                    legend.push(ser.fit ? `${ser.groupName}: ${ser.varName} (I₀=${ser.fit.I0.toFixed(3)}, θ₀=${ser.fit.theta0Deg.toFixed(1)}°)` :
                        `${ser.groupName}: ${ser.varName}${useFit ? '（拟合失败，原始曲线）' : ''}`);
                    if (showPoints) ser.points.forEach(p => {
                        const r = p.intensity * radiusPerIntensity, rad = p.angle * Math.PI / 180;
                        const x = cx + r * Math.cos(rad), y = cy - r * Math.sin(rad);
                        ctx.beginPath(); ctx.arc(x, y, 4, 0, 2 * Math.PI);
                        ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
                    });
                });
                let ly = 20; ctx.font = '12px sans-serif';
                [...new Set(legend)].forEach(text => {
                    const tw = ctx.measureText(text).width;
                    ctx.fillStyle = '#ffffffee'; ctx.fillRect(10, ly - 11, tw + 30, 18);
                    ctx.fillStyle = '#222'; ctx.textAlign = 'left'; ctx.fillText(text, 14, ly); ly += 20;
                });
            }

            // 初始化
            function init() {
                const angles = Array.from({length: 37}, (_, i) => i * 10);
                const i1 = angles.map(a => Math.cos(a * Math.PI/180)**2);
                const i2 = angles.map(a => Math.cos((a - 30) * Math.PI/180)**2 * 0.9 + 0.02);
                const g = createGroup('示例组');
                g.variables = [{ name: 'I₁', data: i1 }, { name: 'I₂', data: i2 }, { name: 'α', data: angles }];
                renderAllGroups([g]);
            }

            window.addGroup = () => {
                const groups = collectAllGroups();
                const angles = Array.from({length: 37}, (_, i) => i * 10);
                const i1 = angles.map(a => Math.cos(a * Math.PI/180)**2);
                const g = createGroup();
                g.variables = [{ name: 'I₁', data: i1 }, { name: 'α', data: angles }];
                groups.push(g);
                renderAllGroups(groups);
            };

            $('#plot-cartesian-btn').onclick = drawCartesian;
            $('#plot-polar-btn').onclick = drawPolar;

            init();
            console.log('✅ 双模式偏振光工具已就绪（极坐标马吕斯拟合）');
        })();
    </script>
